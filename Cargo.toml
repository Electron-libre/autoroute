[workspace]
members = [".", "autoroute-macros"]

[package]
name = "autoroute"
version = "0.1.0"
authors = ["Cedric <cedric.brancourt@gmail.com>"]
edition = "2024"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["actix", "validation"]
# Actix Web adapter.
actix = ["dep:actix-web"]
# Request validation middleware, against the JSON schemas of the specification.
validation = ["actix", "dep:jsonschema", "dep:serde_json", "dep:serde_urlencoded"]

[dependencies]
autoroute-macros = { path = "autoroute-macros", version = "0.1.0" }
actix-web = { version = "4", optional = true }
jsonschema = { version = "0.58.1", default-features = false, optional = true }
serde_json = { version = "1", optional = true }
serde_urlencoded = { version = "0.7", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
env_logger = "0.8.1"
actix-web = "4"
reqwest = "0.10"
futures = "0.3.8"
actix-rt = "2"
trybuild = "1.0"

[lints.clippy]
# Set priority to -1 so pedantic lints are applied after specific allows
pedantic = { priority = -1, level = "deny" }
